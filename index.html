<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="robots" content="noindex">
  <title>Inventario Borgstena</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: #f3f5f8; color: #1d2733;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 420px; width: 100%; background: #fff; border-radius: 16px;
      padding: 32px 24px; text-align: center; box-shadow: 0 4px 24px rgba(31, 58, 95, .12);
      border-top: 6px solid #1f3a5f;
    }
    .icono { font-size: 48px; line-height: 1; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 22px; color: #1f3a5f; }
    p { margin: 0; line-height: 1.5; color: #4a5868; }
    @media (prefers-color-scheme: dark) {
      body { background: #11161d; color: #e4e9ef; }
      .card { background: #1b2430; box-shadow: none; border-top-color: #6f9bd1; }
      h1 { color: #9cc0ea; }
      p { color: #b3bfcc; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icono">🚫</div>
    <h1>Inventario Borgstena</h1>
    <p>Esta aplicación ya no está disponible.</p>
  </div>
</body>
</html>
